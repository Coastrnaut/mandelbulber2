# https://circleci.com/docs/2.0/
version: 2.1
jobs:
  build-and-pack:
    macos:
      xcode: 27.0
    working_directory: ~/mandelbulber2/
    steps:
      - checkout
      - run:
          name: Dependencies
          command: |
            SRC=~/mandelbulber2/
            BUILD=$SRC/build/
            brew update
            brew install llvm qt gsl lzo jpeg libpng libtiff libsndfile tree p7zip wget opencl-clhpp-headers
            # Create the expected directory structure if it doesn't exist
            sudo mkdir -p /usr/local/opt
            # Symlink Apple Silicon Homebrew's LLVM path to the expected Intel location
            sudo ln -s /opt/homebrew/opt/llvm /usr/local/opt/llvm
            # Clean and recreate build directory structure
            rm -rf "$BUILD"
            mkdir -p "$BUILD"
            # 1. Clone the repository into a clean local directory
            CLONE_DIR="$BUILD/OpenCL-CLHPP-Repo"
            git clone https://github.com/KhronosGroup/OpenCL-CLHPP.git "$CLONE_DIR"
            # 2. Build the exact OpenCL folder structure required by Mandelbulber Mac profiles
            mkdir -p "$BUILD/OpenCL"
            # 3. Copy the base contents safely into the folder
            cp -vfr "$CLONE_DIR/include/CL/"* "$BUILD/OpenCL/"
            # 4. Generate the missing cl.hpp file name mapping using the universal source base
            cp -vf "$BUILD/OpenCL/opencl.hpp" "$BUILD/OpenCL/cl.hpp"
      - run:
          name: Build
          command: |
            SRC=~/mandelbulber2/
            BUILD=$SRC/build/
            # build operation
            cd $BUILD && qmake $SRC/mandelbulber2/qmake/mandelbulber-opencl-mac.pro \
            QMAKE_CXXFLAGS+="-I$BUILD -DCL_SILENCE_DEPRECATION -DCL_TARGET_OPENCL_VERSION=120" \
            QMAKE_CFLAGS+="-I$BUILD -DCL_SILENCE_DEPRECATION -DCL_TARGET_OPENCL_VERSION=120"
            cd $BUILD && make -j8
      - run:
          name: Pack
          command: |
            mkdir -p ~/mandelbulber2/build/artifacts/
            cd ~/mandelbulber2/build/ && 7z a artifacts/mandelbulber2-macOS-$CIRCLE_SHA1.zip mandelbulber2.app
            mv ~/mandelbulber2/build/mandelbulber2.dmg ~/mandelbulber2/build/artifacts/mandelbulber2-macOS-$CIRCLE_SHA1.dmg
            cd ~/mandelbulber2/build/ && tree .
      - store_artifacts:
          path: ~/mandelbulber2/build/artifacts/

# TODO: Build App Store version on CI

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-pack



